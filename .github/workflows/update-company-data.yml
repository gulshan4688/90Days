name: Update company data
on:
  schedule:
    - cron: "30 2 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Clone source repos
        run: |
          for row in $(jq -r '.sources[] | "\(.id)|\(.repo)"' tools/company-sources.json); do
            git clone --depth 1 -q "${row#*|}" "repos/${row%%|*}"
          done
      - name: Build company-data.json
        run: python3 tools/build_company_data.py repos company-data.json
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add company-data.json
          git diff --cached --quiet || (git commit -m "Update company data" && git push)
