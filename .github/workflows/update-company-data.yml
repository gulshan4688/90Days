# Rebuilds company-data.json for the "Search by Companies" tab every Monday, or on demand
# (Actions tab -> Update company data -> Run workflow). Only that one file is committed.
name: Update company data
on:
  schedule:
    - cron: "30 2 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Clone source repos
        run: |
          python3 - <<'PY'
          import json, subprocess
          for s in json.load(open('tools/company-sources.json'))['sources']:
              subprocess.run(['git', 'clone', '--depth', '1', '-q', s['repo'], f"repos/{s['id']}"], check=True)
          PY
      - name: Build company-data.json
        run: python3 tools/build_company_data.py repos company-data.json
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add company-data.json
          git diff --cached --quiet || (git commit -m "Update company data" && git push)
